<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Отделения — АЭСК</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="offices">
  <header id="site-header"></header>
  <main class="wrap">
    <div class="page-hero">
      <div class="kicker">Адреса</div>
      <h1>Где нас найти</h1>
      <p class="muted">Центральный офис на Бакинской работает с бизнес-клиентами. Жители сдают показания и оплачивают счета через МРЦ, банки, почту и МФЦ, а районные участки принимают обращения по своим территориям.</p>
    </div>
    <input class="search" id="office-search" type="search" placeholder="Район, город или улица" aria-label="Поиск отделения">
    <div class="offices" id="office-list"></div>
    <section class="section">
      <article class="card">
        <h3>Единый телефон</h3>
        <p>8 (8512) 24-90-00 · Пн–Чт 08:00–17:00, пт 08:00–15:45.</p>
      </article>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/main.js"></script>
</body>
</html>
